<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcuit icon" href="static/images/icono.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
    integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    <title> {% block title %}Astronic{% endblock %}</title>

</head>
<body>
    <div id="header">
		<div class="wrapper clearfix">
			<div id="logo">
				<img src="static/images/icono.png" width="50px">
			</div>
			{% if session.user_id %}
			<ul id="navigation">
				<li>
					<a href="/home">Principal</a>
				</li>
				<li>
					<a href="/profile">Mi perfil</a>
				</li>
				<li>
					<a href="/blog">Blog</a>
				</li>
				<li>
					<a href="/logout">Cerrar Sesión</a>
				</li>
			</ul>

			{% else %}
			<ul id="navigation">
				<li>
					<a href="/register">Registro</a>
				</li>
				<li>
					<a href="/login">Iniciar Sesión</a>
				</li>
			</ul>
			{% endif %}
		</div>
	</div>

	{% block body %}{% endblock %}

	{% if error %}
	<div class="alert alert-danger alert-dismissible fade show" role="alert">
		<strong>¡Error!</strong> {{ error }}
		<button type="button" class="close" data-dismiss="alert" aria-label="Close">
			<span aria-hidden="true">&times;</span>
		</button>
	</div>
	{% endif %}

	<div class="container">

    {% block main %}


    {% endblock %}

	</div>

	<script type="text/javascript" src="{{ url_for('static', filename='js/script.js') }}"></script>

	<script src="https://kit.fontawesome.com/2c63dc7d1c.js" crossorigin="anonymous"></script>


	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

</body>
</html>
